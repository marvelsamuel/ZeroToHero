<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Zero to Hero</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <div class="auth-shell">
    <div class="panel auth-card">
      <span class="display">⚡ ZERO TO HERO</span>
      <div class="tagline">Judge &amp; Admin Login</div>

      <div id="loginError" class="form-error-banner hidden"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">Log In</button>
      </form>

      <p class="text-center text-muted mt-16"><a href="leaderboard.html">← Back to public leaderboard</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      // If already logged in, skip straight to the right dashboard.
      const existing = ZTH.auth.getSession();
      if (existing && existing.token) {
        window.location.href = existing.role === 'Admin' ? 'admin.html' : 'judge.html';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Logging in…';
        try {
          const session = await ZTH.auth.login(
            document.getElementById('username').value.trim(),
            document.getElementById('password').value
          );
          window.location.href = session.role === 'Admin' ? 'admin.html' : 'judge.html';
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Log In';
        }
      });
    })();
  </script>
</body>
</html>
